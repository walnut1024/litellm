model_list:
  - model_name: preview-text
    litellm_params:
      model: openai/preview-text
      api_key: preview-only
      mock_response: "Local UI preview response"
  - model_name: demo-openai-chat
    litellm_params:
      model: openai/gpt-6.1-sol
      api_key: preview-only
      mock_response: "Local mock response for general conversation. No provider request was sent."
